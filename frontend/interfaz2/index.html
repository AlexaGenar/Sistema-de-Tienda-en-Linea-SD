<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Tienda en Línea</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/productos.js" defer></script>
</head>

<body>
  <header class="encabezado">
    <a class="marca" href="/">Tienda en Línea</a>

    <nav class="navegacion">

      <a href="/">Inicio</a>

      <a href="/productos">Consulta de información</a>

      <a aria-current="page" href="/gestionar-productos">Gestión de información</a>

      <a href="/operaciones">Operaciones especiales</a>

    </nav>

  </header>
  <main class="contenedor">
    <section class="titulo-pagina fila-titulo">
      <div>
        <p class="sobrelinea">Catálogo</p>
        <h1>Productos disponibles</h1>
        <p>Consulta el precio y las existencias actuales.</p>
      </div>
      <button id="actualizar-productos" class="boton boton-secundario" type="button">Actualizar consulta</button>
    </section>
    <p id="estado-catalogo" class="mensaje" role="status" aria-live="polite">Cargando productos…</p>
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="lista-productos"></tbody>
      </table>
    </div>
  </main>
  <footer class="pie">Sistema de Tienda en Línea · Sistemas Distribuidos</footer>
</body>

</html>
